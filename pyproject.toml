[project]
name = "arcsong"
version = "0.1.0"
description = "Local app for generating full songs with the YuE2 music model on your own Mac"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Julian Wong", email = "julian@tensoratelier.com" }]
keywords = ["music", "generation", "yue2", "mlx", "apple-silicon", "local-first"]
classifiers = [
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  # mlx-Yue Engine, pinned by commit (D-006). Weights are read from a configurable path.
  # The transcription extra (mido, mir-eval, pretty-midi, scipy) is what covers need (M4).
  "mlx-yue[transcription] @ git+https://github.com/vanch007/mlx-Yue.git@9253ed133343406947bde7b67d43c7a63fb39d99",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "platformdirs>=4",
  "psutil>=5",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/TensorAtelier/arcsong"
Source = "https://github.com/TensorAtelier/arcsong"
Issues = "https://github.com/TensorAtelier/arcsong/issues"

[project.scripts]
arcsong = "arcsong.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
# A source release of the app: what you need to build and run it. The tests are not here
# because ten of them import the M0 spike harness, which stays in the repository — clone it
# if you want to run them.
include = ["arcsong", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
# The M0 measurement harness (`spike/`) stays in the repository as evidence, but it is not
# part of what users install.
packages = ["arcsong"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are called in defaults by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

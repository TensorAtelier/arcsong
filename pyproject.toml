[project]
name = "songloom"
version = "0.1.0"
description = "Local app for generating full songs with the YuE2 music model on your own Mac"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julian Wong", email = "julian@tensoratelier.com" }]
keywords = ["music", "generation", "yue2", "mlx", "apple-silicon", "local-first"]
classifiers = [
  "Environment :: MacOS X",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  # mlx-Yue Engine, pinned by commit (D-006). Weights are read from a configurable path.
  # The transcription extra (mido, mir-eval, pretty-midi, scipy) is what covers need (M4).
  "mlx-yue[transcription] @ git+https://github.com/vanch007/mlx-Yue.git@9253ed133343406947bde7b67d43c7a63fb39d99",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "platformdirs>=4",
  "psutil>=5",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/TensorAtelier/songloom"
Source = "https://github.com/TensorAtelier/songloom"
Issues = "https://github.com/TensorAtelier/songloom/issues"

[project.scripts]
spike = "spike.cli:main"
songloom = "songloom.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["spike", "songloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are called in defaults by design.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

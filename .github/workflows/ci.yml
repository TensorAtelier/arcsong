name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The fake Engine only: no GPU, no model weights. Real renders stay a local, opt-in run.
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
        python: ["3.12"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  lint:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uvx ruff check .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web

  journeys:
    # The release journeys (docs/product/product.md → Release) in headless Chrome against the fake
    # Engine: scripts/release-qa exits non-zero when any journey fails.
    name: Release journeys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: uv sync --frozen
      - name: ffmpeg for the cover journey
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Walk the journeys
        # `shell: bash` adds pipefail, so tee can't hide a failing journey.
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)" scripts/release-qa | tee release-qa.log
      - name: Keep the screenshots
        if: always()
        run: |
          dir="$(sed -n 's/^screenshots: //p' release-qa.log)"
          mkdir -p journeys && if [ -n "$dir" ]; then cp -r "$dir"/. journeys/; fi
          cp release-qa.log journeys/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-journeys
          path: journeys/
